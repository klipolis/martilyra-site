name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Build Jekyll site
        run: |
          bundle install
          bundle exec jekyll build --source . --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          PAGES_REPO_NWO: ${{ github.repository }}
          JEKYLL_ENV: production

      - name: Fix markdown links to directory URLs
        run: |
          for f in _site/*.html; do
            [ -f "$f" ] || continue
            dir="$(basename "$f" .html)"
            mkdir -p "_site/$dir"
            mv "$f" "_site/$dir/index.html"
          done
          find _site -name "*.html" -type f -exec sed -i 's/\/index\.md/\//g' {} +
          find _site -name "*.html" -type f -exec sed -i 's/\.md\([#"]\)/\1/g' {} +
          find _site -name "*.html" -type f -exec sed -i 's|\.md"|/"|g' {} +
          find _site -name "*.html" -type f -exec sed -i "s|\.md'|/'|g" {} +
          # Make external links open in new tab
          find _site -name "*.html" -type f -exec sed -i -E 's|<a href="(https?://[^"]+)"([^>]*)>|<a href="\1"\2 target="_blank" rel="noopener noreferrer">|g' {} +

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
