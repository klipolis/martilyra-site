name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Prepare Jekyll source
        run: |
          mkdir -p site
          rsync -a --exclude='/assets/' CONTENT/ site/
          mkdir -p site/CONTENT
          cp -R CONTENT/assets site/CONTENT/
          mkdir -p site/blog
          cp .github/site-generator/pages/blog.md site/blog/index.md
          mkdir -p site/dalok
          cp .github/site-generator/pages/dalok.md site/dalok/index.md
          cp -R .github/site-generator/_layouts .github/site-generator/_includes .github/site-generator/_data site/
          mkdir -p site/assets
          cp -R .github/site-generator/assets/. site/assets/
          cat > site/_config.yml <<'EOF'
          permalink: pretty
          EOF

      - name: Build Jekyll site
        run: bundle exec jekyll build --source site --destination _site --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          PAGES_REPO_NWO: ${{ github.repository }}
          JEKYLL_ENV: production

      - name: Add Pages base path to internal links
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          base_path = os.environ["BASE_PATH"].rstrip("/")
          relative_asset_pattern = re.compile(
              r"""(?P<prefix>\b(?:href|src)=["'])(?:\.\./)+assets/"""
          )
          if base_path:
              base_segment = re.escape(base_path.lstrip("/"))
              pattern = re.compile(
                  r"""(?P<prefix>\b(?:href|src)=["'])/(?!/)(?!"""
                  + base_segment
                  + r"""(?:/|["']))"""
              )
          for html_file in Path("_site").rglob("*.html"):
              html = html_file.read_text(encoding="utf-8")
              html = relative_asset_pattern.sub(
                  lambda match: match.group("prefix") + base_path + "/CONTENT/assets/",
                  html,
              )
              if base_path:
                  html = pattern.sub(
                      lambda match: match.group("prefix") + base_path + "/",
                      html,
                  )
              html_file.write_text(html, encoding="utf-8")
          PY
          # Make external links open in new tab
          find _site -name "*.html" -type f -exec sed -i -E 's|<a href="(https?://[^"]+)"([^>]*)>|<a href="\1"\2 target="_blank" rel="noopener noreferrer">|g' {} +

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
