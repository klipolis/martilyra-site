<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} - {{ site.title }}{% else %}marti Lyra{% endif %}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <div class="layout-wrapper">
    <aside class="sidebar">
      <button class="sidebar-toggle" aria-label="Toggle menu" onclick="toggleSidebar()"></button>
      <div class="sidebar-content">
        <div class="sidebar-brand">
          <a class="site-title" href="{{ '/' | relative_url }}">
            <img src="/CONTENT/assets/images/profile-photo.jpg" alt="Marti Lyra profilfotó" height="40">
            Marti Lyra
          </a>
        </div>
        {% include navigation.html %}
        <div class="sidebar-videos">
          <h3>Videók</h3>
          <a href="/songs/nekem-a-balaton/" class="video-link">
            <img src="/CONTENT/assets/images/2TUtvvsklAU.jpg" alt="Nekem a Balaton" class="video-thumb">
            <span>Nekem a Balaton</span>
          </a>
          <a href="/songs/tuzes/" class="video-link">
            <img src="/CONTENT/assets/images/IZ6hYASknlc.jpg" alt="Tüzes" class="video-thumb">
            <span>Tüzes</span>
          </a>
          <a href="/songs/melletted/" class="video-link">
            <img src="/CONTENT/assets/images/mU0Uh_f6BKo.jpg" alt="Melletted" class="video-thumb">
            <span>Melletted</span>
          </a>
          <a href="/songs/hazatertes/" class="video-link">
            <img src="/CONTENT/assets/images/VScWWlzQMPY.jpg" alt="Hazatértés" class="video-thumb">
            <span>Hazatértés</span>
          </a>
        </div>
      </div>
    </aside>
    <main class="main-content">
      <div class="container container-1185">
        <h2>{{ page.title }}</h2>
        {{ content }}
      </div>
      {% include footer.html %}
    </main>
  </div>
  <script src="{{ '/assets/js/sidebar.js' | relative_url }}"></script>
</body>
</html>
