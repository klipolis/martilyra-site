<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.data.site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <div class="layout-wrapper">
    <aside class="sidebar">
      <button class="sidebar-toggle" aria-label="Toggle menu" onclick="toggleSidebar()"></button>
      <div class="sidebar-content">
        <div class="sidebar-brand">
          <a class="site-title" href="{{ '/' | relative_url }}">
            <img src="/CONTENT/assets/images/profile-photo.jpg" alt="{{ site.data.site.title }} profilfotó" height="40">
            {{ site.data.site.title }}
          </a>
        </div>
        {% include navigation.html %}
      </div>
    </aside>
    <main class="main-content">
      <div class="container container-1185">
        <h2>{{ page.title }}</h2>
        {{ content }}
      </div>
      {% include footer.html %}
    </main>
  </div>
  <script src="{{ '/assets/js/sidebar.js' | relative_url }}"></script>
</body>
</html>
